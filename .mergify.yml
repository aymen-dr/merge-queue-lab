merge_queue:
  mode: parallel
  max_parallel_checks: 2
  skip_intermediate_results: false

scopes:
  source:
    manual:

queue_rules:
  - name: controlled-lab
    batch_size: 1
    merge_method: squash
    queue_conditions:
      - label = lab-queue
    merge_conditions:
      - check-success = controlled-ci
      - check-success = security-gate
